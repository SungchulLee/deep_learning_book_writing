site_name: Deep Learning
theme:
    name: material
    favicon: assets/favicon.ico

markdown_extensions:
    - admonition
    - pymdownx.details
    - attr_list
    - md_in_html
    - toc:
        permalink: true
    - pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:mermaid2.fence_mermaid_custom
    - pymdownx.arithmatex:
        generic: true

extra_javascript:
    - javascripts/mathjax.js
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    # Load Mermaid AFTER everything
    - https://unpkg.com/mermaid@11/dist/mermaid.min.js
    - javascripts/mermaid-init.js

extra_css:
    - stylesheets/extra.css

# Agent working files — kept in the repo, never published.
# The snapshot separator is a dot: an underscore pattern would also match
# content pages such as mobilenet_v2.md and yolo_v3.md.
exclude_docs: |
  *_score.md
  *.v[0-9]*.md
  # Real content pages that collide with the *_score.md pattern above.
  !inception_score.md
  !01_inception_score.md

